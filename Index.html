<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f8fafc}
header{background:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.logo-left{width:65px;height:65px;border-radius:50%;border:2px solid #16a34a;overflow:hidden}
.logo-left img{width:100%}
.logo-center{font-weight:bold;text-align:center;line-height:1.1}
.logo-center b{color:#16a34a}
.menu-icon{font-size:28px;cursor:pointer;padding:8px}
.menu{position:absolute;top:80px;right:10px;background:#fff;border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,.2);display:none;min-width:210px;z-index:200}
.menu div{padding:14px;border-bottom:1px solid #eee;cursor:pointer}
.hero{height:260px;background:linear-gradient(rgba(22,163,74,.65),rgba(22,163,74,.65)),url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=800') center/cover;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:15px}
.slogan-box{border:3px solid #16a34a;border-radius:14px;background:#fff;margin:15px;padding:22px 10px 15px 10px;position:relative;text-align:center}
.slogan-icon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.slogan-box h3{color:#16a34a;font-style:italic;font-size:18px;line-height:1.4}
.slogan-box p{color:#dc2626;font-weight:bold;margin-top:5px;font-size:13px}
.btn-ps{width:90%;margin:10px auto;display:block;padding:14px;border-radius:8px;font-weight:bold;text-align:center;cursor:pointer;font-size:15px}
.btn-white{background:#fff;border:2px solid #16a34a;color:#16a34a}
.btn-green{background:#16a34a;color:#fff;border:2px solid #16a34a}
.btn-grey{background:#fff;border:2px solid #666;color:#666}
.card{width:94%;margin:12px auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:none}
.card input,.card select,.card textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
.msg{padding:10px;border-radius:6px;margin:8px 0;text-align:center;display:none;font-weight:bold}
.success{background:#dcfce7;color:#166534;display:block}
.error{background:#fee2e2;color:#991b1b;display:block}
.dashboard{display:none;background:#fff;min-height:100vh}
.dash-header{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:18px;text-align:center}
.dash-header h2{font-size:20px;text-transform:uppercase}
.dash-header p{font-size:13px;opacity:.9}
.dash-item{display:flex;align-items:center;gap:14px;padding:15px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.dash-item:hover{background:#f0fdf4}
.dash-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.section-card{margin:12px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.section-header{padding:12px;text-align:center;color:#fff;font-weight:bold;font-size:17px}
.section-card img{width:100%;height:170px;object-fit:cover}
.section-card p{padding:10px;color:#555;font-size:13px}
.quote{background:#f0fdf4;padding:20px;text-align:center;border-top:3px solid #16a34a}
.profile-dropdown{position:absolute;top:80px;right:10px;background:#fff;border-radius:8px;box-shadow:0 5px 20px rgba(0,0,0,.2);display:none;min-width:220px;z-index:200}
.profile-dropdown div{padding:12px 15px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center;cursor:pointer}
.mat-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee;font-size:13px}
</style>
</head>
