<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration ARN</title>
<style>
body{font-family:Arial;padding:20px;background:#0f172a;color:white}
.boite{max-width:500px;margin:30px auto;background:white;color:black;padding:20px;border-radius:12px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#0d6efd;color:white;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="boite">
<h2>Administration ARN</h2>
<p>Entre le mot de passe</p>
<input type="password" id="mdp" placeholder="Mot de passe">
<button onclick="if(document.getElementById('mdp').value=='ARN2026'){alert('Connecté avec succès !')}else{alert('Mauvais mot de passe')}">Se connecter</button>
</div>
</body>
</html>
