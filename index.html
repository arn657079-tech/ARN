<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARN</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f1f5f9}header{background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.logo{background:#1e3a8a;color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.menu-icon{font-size:28px;cursor:pointer}.menu{position:absolute;top:68px;right:10px;background:#fff;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.2);display:none;min-width:240px;z-index:200}.menu div{padding:14px;border-bottom:1px solid #eee;cursor:pointer}.card{width:96%;max-width:680px;margin:12px auto;background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}.btn-bleu{background:#1e40af;color:#fff}.btn-vert{background:#16a34a;color:#fff}.btn-gris{background:#e5e7eb;color:#333}.btn-small{padding:6px 12px;width:auto;font-size:12px}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}label{font-size:13px;font-weight:bold;color:#334155;margin-top:10px;display:block}.niveau{border:1px solid #e2e8f0;border-left:4px solid #1e40af;padding:12px;border-radius:10px;margin-top:14px;background:#f8fafc}canvas{border:2px dashed #1e40af;border-radius:8px;width:100%;background:#fff;touch-action:none}.photo-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #1e40af}.hero-img{width:100%;height:240px;object-fit:cover;border-radius:12px;margin-top:12px}</style></head><body>
<header><div style="display:flex;gap:10px;align-items:center"><div class="logo">ARN</div><div><b>Alliance pour la<br>Renaissance Nutritionnelle</b><br><small style="color:#16a34a;font-weight:bold">FORMER - ACCOMPAGNER - IMPACTER</small></div></div><div class="menu-icon" onclick="toggleMenu()">☰</div><div id="menuBox" class="menu"><div onclick="show('accueil')">🏠 Accueil</div><div onclick="show('creation')">➕ Créer compte</div><div onclick="show('connexion')">🔑 Se connecter</div><div onclick="show('adminLogin')">⚙️ ADMIN</div></div></header>
<div id="accueil" class="card" style="text-align:center"><div style="background:linear-gradient(135deg,#1e3a8a,#16a34a);border-radius:12px;padding:18px;color:#fff;font-weight:bold;font-size:20px">ARN là où commence la vie nous agissons</div><img class="hero-img" src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=800"><button class="btn btn-vert" onclick="show('creation')">✅ VÉRIFICATION MATRICULE</button><button class="btn btn-bleu" onclick="show('creation')">CRÉER MON COMPTE</button><button class="btn btn-bleu" style="background:#0f172a" onclick="show('connexion')">SE CONNECTER</button></div>
<div id="creation" class="card" style="display:none"><h3>Création</h3><label>Matricule *</label><input id="cMat" placeholder="ARN-2026-..."><label>Ton propre mot de passe *</label><input id="cNewPass" type="password" placeholder="••••••••"><button class="btn btn-vert" onclick="creerCompte()">✅ Vérifier & Créer</button><button class="btn btn-gris" onclick="show('accueil')">Retour</button></div>
<div id="connexion" class="card" style="display:none"><h3>Connexion</h3><input id="lMat" placeholder="Matricule"><input id="lMdp" type="password" placeholder="••••••••"><button class="btn btn-bleu" onclick="login()">Entrer</button><button class="btn btn-gris" onclick="show('accueil')">Retour</button></div>
<div id="adminLogin" class="card" style="display:none"><h3>ADMIN</h3><input id="adminMdp" type="password" placeholder="••••••••"><button class="btn btn-bleu" onclick="adminLogin()">Entrer</button></div>
<div id="admin" class="card" style="display:none"><h2>ADMIN</h2><div style="display:flex;gap:6px"><input id="addOneMat" placeholder="ARN-2026-PRES-0001"><button onclick="ajouterUn()" style="width:110px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-weight:bold">➕</button></div><input id="searchAdmin" placeholder="Rechercher..." oninput="renderAdmin()" style="margin-top:8px"><div id="adminListe"></div><div id="adminDetail" style="display:none;border:2px solid #1e40af;border-radius:12px;padding:12px;margin-top:12px"><h3 id="dMat"></h3><div id="dContent"></div><button class="btn btn-gris" onclick="document.getElementById('adminDetail').style.display='none'">Fermer</button></div><button class="btn btn-gris" onclick="show('accueil')">Accueil</button></div>
<div id="fiche" class="card" style="display:none"><h2>Fiche - <span id="fMatricule"></span></h2><div class="niveau"><h4>NIVEAU 1</h4><label>Photo profil *</label><input type="file" accept="image/*" onchange="savePhoto(this,'photoProfil')"><img id="prev_profil" class="photo-preview" style="display:none"></div><div class="niveau"><h4>NIVEAU 2</h4><label>Nom *</label><input id="f_nom"><label>Sexe *</label><select id="f_sexe"><option></option><option>Masculin</option><option>Féminin</option></select><label>Date *</label><input id="f_dob" type="date"><label>Lieu *</label><input id="f_lieu"><label>Nationalité *</label><input id="f_nat" value="Guinéenne"><label>GS *</label><select id="f_gs"><option></option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="niveau"><h4>NIVEAU 3</h4><label>Père *</label><input id="f_pere"><label>Mère *</label><input id="f_mere"><label>Situation *</label><select id="f_sit"><option>Célibataire</option><option>Marié(e)</option><option>Divorcé(e)</option><option>Veuf(ve)</option></select><label>Conjoint/enfants</label><input id="f_conj"><label>Urgence *</label><input id="f_urg"></div><div class="niveau"><h4>NIVEAU 4</h4><label>Série *</label><input id="f_serie"><label>Fonction *</label><input id="f_fonc"><label>Profession *</label><input id="f_prof"><label>Grade *</label><input id="f_grade"><label>Date eng *</label><input id="f_eng" type="date"><label>Affectation *</label><input id="f_aff"></div><div class="niveau"><h4>NIVEAU 5 + SIGNATURE</h4><label>Adresse *</label><input id="f_adr"><label>Email *</label><input id="f_email"><label>Contact 1 *</label><input id="f_c1"><label>Contact 2 *</label><input id="f_c2"><label>Signature - Dessine *</label><canvas id="sigCanvas" width="400" height="150"></canvas><div style="display:flex;gap:6px"><button class="btn btn-gris btn-small" onclick="clearSig()">Effacer</button><button class="btn btn-bleu btn-small" onclick="saveSig()">Valider</button></div><img id="sigPreview" style="display:none;width:100%;border:1px solid #ccc;border-radius:8px;margin-top:6px"></div><button class="btn btn-vert" onclick="sauverFiche()">💾 Sauver</button></div>
<script>
var liste=JSON.parse(localStorage.getItem('listeMatriculesARN')||'[]');if(!liste.length){liste=[];for(let i=1;i<=1000;i++)liste.push('ARN-2026-'+String(i).padStart(4,'0'))}var users=JSON.parse(localStorage.getItem('arn_users')||'{}');var current=null;
function toggleMenu(){var m=document.getElementById('menuBox');m.style.display=m.style.display==='block'?'none':'block'}function show(id){['accueil','creation','connexion','adminLogin','admin','fiche'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block';document.getElementById('menuBox').style.display='none'}
function norm(m){return m.trim().toUpperCase().replace(/\s+/g,'-').replace(/--+/g,'-')}function valide(m){return /^ARN-\d{4}(-[A-Z]+)*-\d{1,8}$/.test(m)}function saveLS(){localStorage.setItem('listeMatriculesARN',JSON.stringify(liste));localStorage.setItem('arn_users',JSON.stringify(users))}
function creerCompte(){let mat=norm(document.getElementById('cMat').value);let np=document.getElementById('cNewPass').value;if(!valide(mat)){alert('Invalide');return}if(!liste.includes(mat)){alert('Non généré');return}if(!np||np.length<4){alert('Min 4 caractères');return}if(!users[mat])users[mat]={matricule:mat};users[mat].password=np;saveLS();current=mat;loadFiche();show('fiche');initCanvas()}
function login(){let mat=norm(document.getElementById('lMat').value);let mdp=document.getElementById('lMdp').value;if(!users[mat]||!users[mat].password){alert('Non créé');return}if(mdp!==users[mat].password){alert('Mauvais mdp');return}current=mat;loadFiche();show('fiche');initCanvas()}
function adminLogin(){if(document.getElementById('adminMdp').value==='ARN2026'){show('admin');renderAdmin()}else alert('Faux')}
function ajouterUn(){let mat=norm(document.getElementById('addOneMat').value);if(!valide(mat)){alert('Invalide');return}if(liste.includes(mat)){alert('Existe');return}liste.push(mat);liste.sort();saveLS();document.getElementById('addOneMat').value='';renderAdmin()}
function renderAdmin(){let h='';liste.slice(0,300).forEach(m=>{let u=users[m]||{};h+=`<div style="border:1px solid #ddd;border-radius:8px;padding:8px;margin-top:6px"><b>${m}</b> - ${u.nom||'Vide'}<br><button onclick="voirDetailAdmin('${m}')" style="background:#1e40af;color:#fff;border:none;padding:5px 10px;border-radius:5px">Voir</button> <button onclick="supprimerMat('${m}')" style="background:#fee2e2;color:red;border:1px solid #fecaca;padding:5px 10px;border-radius:5px">❌</button></div>`});document.getElementById('adminListe').innerHTML=h}
function voirDetailAdmin(m){let u=users[m];if(!u||!u.nom){alert('Vide');return}document.getElementById('dMat').textContent=m;let html='';if(u.photoProfil)html+=`<img src="${u.photoProfil}" style="width:80px;height:80px;border-radius:50%"><br>`;for(let k in u){if(['photoProfil','password','signature'].includes(k))continue;html+=`<div style="font-size:13px;border-bottom:1px dashed #ddd;padding:3px 0"><b>${k}:</b> ${u[k]}</div>`}if(u.signature)html+=`<div><b>Signature:</b><br><img src="${u.signature}" style="width:100%;border:1px solid #000"></div>`;document.getElementById('dContent').innerHTML=html;document.getElementById('adminDetail').style.display='block'}
function supprimerMat(m){if(!confirm('Supprimer '+m))return;liste=liste.filter(x=>x!==m);delete users[m];saveLS();renderAdmin()}
function loadFiche(){let u=users[current];document.getElementById('fMatricule').textContent=current;['nom','sexe','dob','lieu','nat','gs','pere','mere','sit','conj','urg','serie','fonc','prof','grade','eng','aff','adr','email','c1','c2'].forEach(k=>{let el=document.getElementById('f_'+k);if(el&&u[k])el.value=u[k]});if(u.photoProfil){document.getElementById('prev_profil').src=u.photoProfil;document.getElementById('prev_profil').style.display='block'}if(u.signature){document.getElementById('sigPreview').src=u.signature;document.getElementById('sigPreview').style.display='block'}}
function sauverFiche(){let u=users[current];let req=['photoProfil','nom','sexe','dob','lieu','pere','mere','urg','serie','fonc','prof','grade','eng','aff','adr','email','c1','c2','signature'];let miss=[];req.forEach(k=>{if(!u[k])miss.push(k)});if(miss.length){alert('Manque: '+miss.join(','));return}['nom','sexe','dob','lieu','nat','gs','pere','mere','sit','conj','urg','serie','fonc','prof','grade','eng','aff','adr','email','c1','c2'].forEach(k=>{let el=document.getElementById('f_'+k);if(el)u[k]=el.value});saveLS();alert('Fiche sauvée !')}
function savePhoto(i,k){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{users[current][k]=e.target.result;saveLS();if(k==='photoProfil'){document.getElementById('prev_profil').src=e.target.result;document.getElementById('prev_profil').style.display='block'}};r.readAsDataURL(f)}
function initCanvas(){let c=document.getElementById('sigCanvas');if(!c)return;let ctx=c.getContext('2d'),d=false;function p(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)}}c.onmousedown=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onmousemove=e=>{if(!d)return;let q=p(e);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineTo(q.x,q.y);ctx.stroke()};c.onmouseup=()=>d=false;c.ontouchstart=e=>{e.preventDefault();d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.ontouchmove=e=>{e.preventDefault();if(!d)return;let q=p(e);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineTo(q.x,q.y);ctx.stroke()};c.ontouchend=()=>d=false}
function clearSig(){let c=document.getElementById('sigCanvas');c.getContext('2d').clearRect(0,0,c.width,c.height);document.getElementById('sigPreview').style.display='none';if(users[current])delete users[current].signature}
function saveSig(){let c=document.getElementById('sigCanvas'),data=c.toDataURL();if(data.length<1000){alert('Dessine !');return}users[current].signature=data;document.getElementById('sigPreview').src=data;document.getElementById('sigPreview').style.display='block';saveLS();alert('Signature validée !')}
</script></body></html>
