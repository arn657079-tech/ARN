<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARN - Alliance pour la Renaissance Nutritionnelle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f6f8}
header{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0d4aa5}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:50px;height:50px;background:#0d4aa5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.hero{height:220px;background:url('https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=800') center/cover}
.alert{border:2px solid orange;border-radius:12px;padding:15px;margin:15px;text-align:center;color:#b91c1c;font-weight:bold;background:#fff}
.btn{display:block;width:90%;margin:10px auto;padding:14px;border-radius:10px;font-weight:bold;text-align:center;cursor:pointer}
.btn-outline{border:2px solid #0d4aa5;color:#0d4aa5;background:#fff}
.btn-blue{background:#0d4aa5;color:#fff;border:none}
.btn-grey{background:#f3f3f3;border:1px solid #ccc}
.btn-green{background:#16a34a;color:#fff;border:none}
.form{width:90%;margin:15px auto;display:none;background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.form input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.msg{padding:10px;border-radius:6px;margin:8px 0;text-align:center;display:none}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>

<header>
<div class="logo"><div class="logo-icon">ARN</div><div><b>Alliance pour la<br>Renaissance Nutritionnelle</b><br><small style="color:green">FORMER • ACCOMPAGNER • IMPACTER</small></div></div>
<div>☰</div>
</header>

<div class="hero"></div>

<div class="alert">Ouverture de la session de formation ARN<br>le : 10 Septembre 2026.<br>Rentrée Nutrition 2026 : À venir</div>

<button class="btn btn-outline" onclick="afficher('creation')">CRÉER UN COMPTE ARN</button>
<button class="btn btn-blue" onclick="afficher('connexion')">SE CONNECTER</button>
<button class="btn btn-grey">📄 Guide d'utilisation</button>
<button class="btn btn-grey">❓ FAQ</button>
<button class="btn btn-green">✅ VÉRIFIER ATTESTATION ARN</button>

<div id="creation" class="form">
<h3>Créer votre compte ARN</h3>
<div id="messageCreation" class="msg"></div>
<input id="matricule" placeholder="Votre Matricule (ex: ARN-2026-0001)">
<input id="nom" placeholder="Nom complet">
<input id="email" placeholder="Adresse e-mail">
<input id="motdepasse" type="password" placeholder="Mot de passe">
<button class="btn btn-blue" onclick="creerCompte()">Valider et créer mon compte</button>
<small style="display:block;text-align:center;margin-top:10px">Matricules de test : ARN-2026-0001 à ARN-2026-0005</small>
</div>

<div id="connexion" class="form">
<h3>Connexion ARN</h3>
<div id="messageConnexion" class="msg"></div>
<input id="matriculeConnexion" placeholder="Votre Matricule">
<input id="motdepasseConnexion" type="password" placeholder="Mot de passe">
<button class="btn btn-blue" onclick="seConnecter()">Se connecter</button>
</div>

<script>
let matriculesValides = ["ARN-2026-0001","ARN-2026-0002","ARN-2026-0003","ARN-2026-0004","ARN-2026-0005"];
let comptes = JSON.parse(localStorage.getItem('comptesARN') || '[]');

function afficher(type){
document.getElementById('creation').style.display = type==='creation' ? 'block' : 'none';
document.getElementById('connexion').style.display = type==='connexion' ? 'block' : 'none';
}

function afficherMessage(id, texte, succes){
let e = document.getElementById(id);
e.style.display='block';
e.textContent=texte;
e.className='msg '+(succes?'success':'error');
}

function creerCompte(){
let mat = document.getElementById('matricule').value.trim().toUpperCase();
let nom = document.getElementById('nom').value.trim();
let email = document.getElementById('email').value.trim();
let mdp = document.getElementById('motdepasse').value;

if(!matriculesValides.includes(mat)){
afficherMessage('messageCreation','Ce matricule est invalide ou non autorisé par l administration ARN',false);
return;
}
if(comptes.find(c=>c.matricule===mat)){
afficherMessage('messageCreation','Ce matricule possède déjà un compte',false);
return;
}
if(!nom || !email || !mdp){
afficherMessage('messageCreation','Veuillez remplir tous les champs',false);
return;
}
comptes.push({matricule:mat,nom:nom,email:email,password:mdp});
localStorage.setItem('comptesARN', JSON.stringify(comptes));
afficherMessage('messageCreation','✅ Compte créé avec succès pour '+mat+' ! Vous pouvez vous connecter maintenant.',true);
}

function seConnecter(){
let mat = document.getElementById('matriculeConnexion').value.trim().toUpperCase();
let mdp = document.getElementById('motdepasseConnexion').value;
let c = comptes.find(x=>x.matricule===mat && x.password===mdp);
if(c){
afficherMessage('messageConnexion','✅ Bienvenue '+c.nom+' ('+c.matricule+') - Connexion réussie !',true);
}else{
afficherMessage('messageConnexion','Matricule ou mot de passe incorrect',false);
}
}
</script>

</body>
  </html>
