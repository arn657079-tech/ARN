<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARN - Vérification</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:15px;display:flex;justify-content:center}
.card{background:#fff;max-width:420px;width:100%;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden}
.header{padding:18px;text-align:center;color:#fff}
.header.ok{background:#16a34a}.header.bad{background:#dc2626}
.header.org{font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.95;margin-bottom:6px;font-weight:700}
.header h2{margin:0;font-size:20px}
.content{padding:20px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.row b{color:#555}.row span{font-weight:700;text-align:right;max-width:60%}
.footer{padding:12px;text-align:center;font-size:12px;color:#777;background:#fafafa}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="card" id="app">
<div class="header ok" id="head"><div class="org">Alliance pour la Renaissance Nutritionnelle</div><h2>Chargement...</h2></div>
<div class="content" id="cont">Veuillez patienter</div>
<div class="footer">Association des Artisans de la République de Guinée<br>Agrément: 000223/MATD/VC/CAB/DRATD/2026</div>
</div>
<script>
async function run(){
 const id = new URLSearchParams(location.search).get('id');
 if(!id){ document.getElementById('head').innerHTML='<div class="org">Alliance pour la Renaissance Nutritionnelle</div><h2>ID manquant</h2>'; document.getElementById('head').className='header bad'; document.getElementById('cont').innerHTML='Aucun ID fourni'; return; }
 try{
   const res = await fetch('./membres.json?v='+Date.now());
   const data = await res.json();
   const m = data[id];
   if(!m){
     document.getElementById('head').className='header bad';
     document.getElementById('head').innerHTML='<div class="org">Alliance pour la Renaissance Nutritionnelle</div><h2>CARTE NON TROUVEE</h2>';
     document.getElementById('cont').innerHTML=`<div style="text-align:center;padding:20px"><span class="badge bad">INVALIDE</span><p>ID: ${id}</p><p>Cette carte n'existe pas dans la base ARN</p></div>`;
     return;
   }
   document.getElementById('head').className='header ok';
   document.getElementById('head').innerHTML='<div class="org">Alliance pour la Renaissance Nutritionnelle</div><h2>✓ CARTE AUTHENTIQUE</h2>';
   document.getElementById('cont').innerHTML=`
     <div style="text-align:center;margin-bottom:15px"><span class="badge ok">${m.statut.toUpperCase()} - VERIFIEE</span></div>
     <div class="row"><b>Serie / ID:</b><span>${id}</span></div>
     <div class="row"><b>Matricule:</b><span>${m.matricule}</span></div>
     <div class="row"><b>Nom complet:</b><span>${m.nom}</span></div>
     <div class="row"><b>Fonction:</b><span>${m.fonction}</span></div>
     <div class="row"><b>Statut:</b><span>${m.statut}</span></div>
     <div class="row"><b>Valable jusqu'au:</b><span>${m.valable}</span></div>
     <div class="row"><b>Agrément:</b><span>${m.agrement}</span></div>
     <div class="row"><b>Siège:</b><span>${m.siege}</span></div>
     <div class="row"><b>Contact ARN:</b><span>${m.contact_arn}</span></div>
     <div class="row"><b>Contact perso:</b><span>${m.contact_perso}</span></div>
   `;
 }catch(e){
   document.getElementById('head').className='header bad';
   document.getElementById('head').innerHTML='<div class="org">Alliance pour la Renaissance Nutritionnelle</div><h2>Erreur</h2>';
   document.getElementById('cont').innerHTML='Impossible de charger membres.json: '+e.message;
 }
}
run();
</script>
</body>
</html>
